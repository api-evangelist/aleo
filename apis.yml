aid: aleo
name: Aleo
description: >-
  Aleo is a privacy-first, zero-knowledge Layer-1 blockchain for building fully
  private applications. Developers write smart contracts in Leo — a purpose-built
  language for zero-knowledge applications — compile them with snarkVM, and run
  them on the decentralized snarkOS network, keeping inputs, outputs, and program
  state private using zk-SNARK proofs while still being publicly verifiable. The
  ecosystem, developed by Provable (ProvableHQ), includes the Leo language and CLI,
  the snarkVM zkVM and snarkOS operating system, JavaScript/TypeScript and Python
  SDKs, a WASM runtime for in-browser proving, the Aleo Explorer, and a public node
  REST API for reading on-chain state and broadcasting transactions across mainnet
  and testnet. Aleo is a portfolio company of a16z.
